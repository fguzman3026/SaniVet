<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="El plan sanitario de tus mascotas, calculado automaticamente." />
    <meta name="theme-color" content="#FDF8F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#211D1A" media="(prefers-color-scheme: dark)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Nunito+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <title>SaniVet</title>

    <script>
      // Aplica el tema guardado antes del primer paint, para que no haya
      // un parpadeo si la elección manual difiere de la preferencia del sistema.
      (function () {
        var tema = localStorage.getItem('sanivet:tema')
        if (tema === 'light' || tema === 'dark') document.documentElement.setAttribute('data-theme', tema)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
